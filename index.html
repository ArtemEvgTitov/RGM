<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Таймер до 1 июля 2027</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #0b1a2e, #1a3a5c);
        color: #fff;
        text-align: center;
        padding: 20px;
      }

      .container {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(8px);
        border-radius: 40px;
        padding: 50px 40px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        max-width: 700px;
        width: 100%;
      }

      h1 {
        font-size: 2.2rem;
        font-weight: 300;
        letter-spacing: 2px;
        margin-bottom: 10px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      }

      .subtitle {
        font-size: 1.1rem;
        opacity: 0.7;
        margin-bottom: 30px;
        letter-spacing: 1px;
      }

      .timer {
        display: flex;
        justify-content: space-around;
        gap: 10px;
        flex-wrap: wrap;
      }

      .time-block {
        background: rgba(0, 0, 0, 0.25);
        border-radius: 20px;
        padding: 15px 10px;
        min-width: 80px;
        flex: 1 0 auto;
        box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.3);
        border-bottom: 3px solid #ffb347;
      }

      .time-block span {
        display: block;
      }

      .number {
        font-size: 3.8rem;
        font-weight: 700;
        letter-spacing: 2px;
        background: linear-gradient(135deg, #f7971e, #ffd200);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.2;
      }

      .label {
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        opacity: 0.7;
        margin-top: 5px;
      }

      .message {
        margin-top: 30px;
        font-size: 1.3rem;
        font-weight: 300;
        opacity: 0;
        min-height: 2.5rem;
        transition: all 0.3s ease;
      }

      .message.expired {
        color: #ffb347;
        font-weight: 500;
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0% {
          opacity: 0.6;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.03);
        }
        100% {
          opacity: 0.6;
          transform: scale(1);
        }
      }

      @media (max-width: 500px) {
        .container {
          padding: 30px 15px;
        }
        .number {
          font-size: 2.8rem;
        }
        .time-block {
          min-width: 60px;
          padding: 10px 5px;
        }
        h1 {
          font-size: 1.6rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Ваня РГМ</h1>
      <div class="subtitle">до 1 июля 2027 года</div>

      <div class="timer" id="timer">
        <div class="time-block">
          <span class="number" id="days">00</span>
          <span class="label">Дней</span>
        </div>
        <div class="time-block">
          <span class="number" id="hours">00</span>
          <span class="label">Часов</span>
        </div>
        <div class="time-block">
          <span class="number" id="minutes">00</span>
          <span class="label">Минут</span>
        </div>
        <div class="time-block">
          <span class="number" id="seconds">00</span>
          <span class="label">Секунд</span>
        </div>
      </div>

      <div class="message" id="message">Осталось ждать...</div>
    </div>

    <script>
      (function () {
        // Целевая дата: 1 июля 2027 года, 00:00:00 (локальное время)
        const targetDate = new Date("July 1, 2027 00:00:00").getTime();

        // Элементы для отображения
        const daysEl = document.getElementById("days");
        const hoursEl = document.getElementById("hours");
        const minutesEl = document.getElementById("minutes");
        const secondsEl = document.getElementById("seconds");
        const messageEl = document.getElementById("message");

        // Функция добавления ведущего нуля
        function padZero(num) {
          return String(num).padStart(2, "0");
        }

        // Основная функция обновления таймера
        function updateTimer() {
          const now = Date.now();
          let diff = targetDate - now;

          // Если время вышло
          if (diff <= 0) {
            daysEl.textContent = "00";
            hoursEl.textContent = "00";
            minutesEl.textContent = "00";
            secondsEl.textContent = "00";
            messageEl.textContent = "🎉 1 июля 2027 наступило! Поздравляем! 🎉";
            messageEl.classList.add("expired");
            return;
          }

          // Убираем класс expired, если он был
          messageEl.classList.remove("expired");

          // Расчёт дней, часов, минут, секунд
          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          diff -= days * (1000 * 60 * 60 * 24);
          const hours = Math.floor(diff / (1000 * 60 * 60));
          diff -= hours * (1000 * 60 * 60);
          const minutes = Math.floor(diff / (1000 * 60));
          diff -= minutes * (1000 * 60);
          const seconds = Math.floor(diff / 1000);

          // Отображение
          daysEl.textContent = padZero(days);
          hoursEl.textContent = padZero(hours);
          minutesEl.textContent = padZero(minutes);
          secondsEl.textContent = padZero(seconds);

          // Сообщение с оставшимся временем (для красоты)
          let msg = `Осталось ${days} дн. ${hours} ч. ${minutes} мин. ${seconds} сек.`;
          messageEl.textContent = msg;
        }

        // Первый запуск
        updateTimer();

        // Обновление каждую секунду
        setInterval(updateTimer, 1000);
      })();
    </script>
  </body>
</html>
